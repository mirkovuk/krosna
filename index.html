<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krosna — Backdrop Generator</title>
<style>
@font-face {
  font-family: 'Simplon';
  src: url('https://pub-01cd89e94ac94448830dc6f8b4548dbc.r2.dev/SimplonBPMono-Regular.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Simplon';
  src: url('https://pub-01cd89e94ac94448830dc6f8b4548dbc.r2.dev/SimplonBPMono-Bold.otf') format('opentype');
  font-weight: 700;
  font-style: normal;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #1c1c1c;
  --bg2:    #272727;
  --bg3:    #333333;
  --border: #3a3a3a;
  --text:   #e8e4dc;
  --muted:  #666666;
}

body {
  font-family: 'Simplon', monospace;
  font-size: 11px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  letter-spacing: 0.04em;
  position: relative;
}

/* CANVAS fills entire viewport */
#canvas-wrap {
  position: absolute;
  inset: 0;
}

/* SIDEBAR — floating panel */
#sidebar {
  position: absolute;
  top: 20px;
  left: 20px;
  bottom: 20px;
  width: 256px;
  background: #212121;
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: visible;
  z-index: 100;
  box-shadow: 0 8px 40px rgba(0,0,0,0.55);
}
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.brand-sub {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}

.section {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

/* DROPDOWN */
.dropdown-wrap { position: relative; }

.dropdown-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 9px 12px;
  cursor: pointer;
  width: 100%;
  color: var(--text);
  font-family: 'Simplon', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: border-color 0.15s;
  user-select: none;
}
.dropdown-trigger:hover, .dropdown-trigger.open { border-color: var(--text); }

.trigger-left { display: flex; align-items: center; gap: 8px; }
.trigger-chips { display: flex; gap: 3px; }
.trigger-chip { width: 12px; height: 12px; border-radius: 1px; }
.trigger-arrow { font-size: 8px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.dropdown-trigger.open .trigger-arrow { transform: rotate(90deg); }

.dropdown-panel {
  display: none;
  position: fixed;
  width: 230px;
  background: #212121;
  border: 1px solid var(--border);
  border-radius: 4px;
  z-index: 500;
  box-shadow: 6px 6px 24px rgba(0,0,0,0.6);
}
.dropdown-panel.open { display: block; }

.preset-opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.preset-opt:first-child { border-radius: 4px 4px 0 0; }
.preset-opt:last-child  { border-radius: 0 0 4px 4px; border-bottom: none; }
.preset-opt:last-child { border-bottom: none; }
.preset-opt:hover, .preset-opt.active { background: var(--bg3); }

.preset-opt-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.preset-opt-chips { display: flex; gap: 3px; }
.preset-opt-chip { width: 14px; height: 14px; border-radius: 1px; }

/* COLOUR MAP */
.colour-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.colour-row:last-child { margin-bottom: 0; }

.colour-swatch {
  width: 38px;
  height: 38px;
  border-radius: 2px;
  border: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
}
.colour-swatch:hover { border-color: var(--text); }
.colour-swatch input[type="color"] {
  position: absolute;
  width: 200%; height: 200%;
  top: -25%; left: -25%;
  border: none; cursor: pointer; opacity: 0;
}
.colour-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ROCK BUTTONS */
.rock-list { display: flex; flex-direction: column; gap: 6px; }

.rock-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  cursor: pointer;
  font-family: 'Simplon', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  transition: all 0.15s;
  width: 100%;
}
.rock-btn:hover { border-color: var(--muted); color: var(--text); }
.rock-btn.active { border-color: var(--text); color: var(--text); background: var(--bg3); }

.rock-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: 1px solid var(--muted);
  flex-shrink: 0;
  transition: all 0.15s;
}
.rock-btn.active .rock-dot { background: var(--text); border-color: var(--text); }

/* SLIDERS */
.slider-row { margin-bottom: 12px; }
.slider-row:last-child { margin-bottom: 0; }
.slider-label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
input[type="range"] {
  width: 100%; height: 2px;
  -webkit-appearance: none;
  background: var(--border);
  outline: none;
  cursor: pointer;
  border-radius: 1px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--text);
}

/* TOGGLES */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.toggle-row:last-child { margin-bottom: 0; }
.toggle-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}
.toggle {
  width: 32px; height: 16px;
  background: var(--border);
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  border: none; outline: none;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--text); }
.toggle::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: var(--bg);
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: left 0.2s;
}
.toggle.on::after { left: 19px; }

/* FORMAT DROPDOWN */
.format-wrap { position: relative; }
.format-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  cursor: pointer;
  width: 100%;
  color: var(--text);
  font-family: 'Simplon', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: border-color 0.15s;
  user-select: none;
}
.format-trigger:hover, .format-trigger.open { border-color: var(--text); }
.format-arrow { font-size: 8px; color: var(--muted); transition: transform 0.2s; }
.format-trigger.open .format-arrow { transform: rotate(180deg); }

.format-panel {
  display: none;
  position: absolute;
  bottom: calc(100% + 4px);
  left: 0; right: 0;
  background: #212121;
  border: 1px solid var(--border);
  border-radius: 4px;
  z-index: 300;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
}
.format-panel.open { display: block; }

.format-opt {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  transition: background 0.1s, color 0.1s;
}
.format-opt:last-child { border-bottom: none; }
.format-opt:hover, .format-opt.active { background: var(--bg3); color: var(--text); }

/* BOTTOM */
.sidebar-bottom {
  padding: 16px 20px;
  margin-top: auto;
  border-top: 1px solid var(--border);
}
.export-btn {
  width: 100%;
  padding: 13px;
  background: var(--text);
  color: var(--bg);
  border: none;
  cursor: pointer;
  font-family: 'Simplon', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: opacity 0.15s;
}
.export-btn:hover { opacity: 0.8; }
.credit {
  font-size: 8px;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.6;
}

/* CANVAS — defined in body block above */
#canvas-wrap canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

#grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.18;
  z-index: 5;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  mix-blend-mode: overlay;
}

#format-frame {
  position: absolute;
  border: 1px solid rgba(255,255,255,0.12);
  pointer-events: none;
  z-index: 6;
  transition: all 0.3s ease;
  display: none;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  background: var(--bg);
  flex-direction: column;
  gap: 14px;
  transition: opacity 0.4s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loading-text {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}
.loading-bar {
  width: 60px; height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.loading-bar::after {
  content: '';
  position: absolute;
  height: 100%; width: 40%;
  background: var(--text);
  animation: slide 0.9s ease-in-out infinite;
}
@keyframes slide { 0% { left: -40%; } 100% { left: 140%; } }

#hint {
  position: absolute;
  bottom: 16px; right: 16px;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
  pointer-events: none;
  z-index: 6;
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="brand-name">Krosna</div>
    <div class="brand-sub">Backdrop Generator</div>
  </div>

  <!-- COLOUR PRESETS -->
  <div class="section">

    <div class="dropdown-wrap" id="preset-wrap">
      <div class="dropdown-trigger" id="preset-trigger">

  <!-- OUTPUT FORMAT -->
  <div class="section">

    <div class="format-wrap">

        <span id="format-label">FREE / FULLSCREEN</span>

  <div class="sidebar-bottom">

</div>

<script type="module">
import * as THREE from 'three';
const { GLTFLoader }    = await import('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js');
const { OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js');

// DATA
const CDN = 'https://pub-01cd89e94ac94448830dc6f8b4548dbc.r2.dev/';
const models = [
  { file: CDN + 'roche_-_rides_a_cretes_lingoides.glb', credit: 'Primošten · Poly Pizza' },
  { file: CDN + 'td_n6_-_roche_n10.glb',                credit: 'Sibenik · Poly Pizza' },
  { file: CDN + 'stone002.glb',                          credit: 'Krk · Poly Pizza' },
];

const presets = [
  { id:'001', name:'ADRIATIQUE', a:'#A29115', b:'#5781F0', c:'#E3EADD' },
  { id:'002', name:'VINARIJA',   a:'#c8a96e', b:'#f0e6d0', c:'#2a1a0e' },
  { id:'003', name:'MASLINE',    a:'#7aab8a', b:'#e8f0e2', c:'#192b1f' },
  { id:'004', name:'ZIDINE',     a:'#d4c5a0', b:'#f2ede0', c:'#201c14' },
  { id:'005', name:'KROSNA',     a:'#e84d6a', b:'#f0d4a8', c:'#1a0810' },
  { id:'006', name:'ZEMLJA',     a:'#4d8ae8', b:'#e8dcc8', c:'#0a1020' },
];

const formats = [
  { label:'IG POST / 1080x1080',      w:1080, h:1080 },
  { label:'IG STORY / 1080x1920',     w:1080, h:1920 },
  { label:'IG LANDSCAPE / 1080x608',  w:1080, h:608  },
  { label:'A4 PORTRAIT / 2480x3508',  w:2480, h:3508 },
  { label:'A4 LANDSCAPE / 3508x2480', w:3508, h:2480 },
  { label:'FREE / FULLSCREEN',        w:null, h:null  },
];

// STATE
const state = {
  colorA:'#A29115', colorB:'#5781F0', colorC:'#E3EADD',
  angle:45, height:60, scale:100, contrast:50, grainAmt:18,
  misreg:false, showBg:true, formatIdx:5,
};

let currentModelIdx = 0, currentMesh = null, gradientMap = null;
let modelMaxDim = 1;

// THREE
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.toneMapping = THREE.NoToneMapping;
wrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.01, 1000);
camera.position.set(0, 0, 2.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.3;
controls.maxDistance = 10;

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(dirLight, ambLight);

function updateSceneBg() {
  if (state.showBg) {
    scene.background = new THREE.Color(state.colorC);
    renderer.setClearColor(new THREE.Color(state.colorC), 1);
  } else {
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
  }
}

// GRADIENT MAP
function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
}

function updateGradientMap() {
  const steps = 64, data = new Uint8Array(steps*4);
  const cA = hexToRgb(state.colorA), cB = hexToRgb(state.colorB);
  const k  = state.contrast / 100;
  for (let i=0; i<steps; i++) {
    let t = Math.min(1, Math.max(0, Math.pow(i/(steps-1), 1+(k-0.5)*2)));
    data[i*4]   = Math.round((cA[0]+(cB[0]-cA[0])*t)*255);
    data[i*4+1] = Math.round((cA[1]+(cB[1]-cA[1])*t)*255);
    data[i*4+2] = Math.round((cA[2]+(cB[2]-cA[2])*t)*255);
    data[i*4+3] = 255;
  }
  if (gradientMap) gradientMap.dispose();
  gradientMap = new THREE.DataTexture(data, steps, 1, THREE.RGBAFormat);
  gradientMap.minFilter = gradientMap.magFilter = THREE.LinearFilter;
  gradientMap.needsUpdate = true;
  applyMaterial();
  updateSceneBg();
}

function applyMaterial() {
  if (!currentMesh || !gradientMap) return;
  const mat = new THREE.MeshToonMaterial({ gradientMap });
  currentMesh.traverse(n => { if (n.isMesh) n.material = mat; });
}

// MODEL LOAD
const loader = new GLTFLoader();

function loadModel(idx) {
  document.getElementById('loading').classList.remove('hidden');
  if (currentMesh) { scene.remove(currentMesh); currentMesh = null; }

  loader.load(models[idx].file, (gltf) => {
    const model = gltf.scene;
    const group = new THREE.Group();
    group.add(model);
    scene.add(group);

    const box    = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    modelMaxDim  = Math.max(size.x, size.y, size.z);

    model.position.set(-centre.x, -centre.y, -centre.z);
    group.scale.setScalar((1.8 * (state.scale/100)) / modelMaxDim);
    currentMesh = group;

    camera.position.set(0, 0, 2.5);
    camera.lookAt(0, 0, 0);
    controls.target.set(0, 0, 0);
    controls.update();

    updateLightPosition();
    applyMaterial();

    document.getElementById('credit').textContent = models[idx].credit;
    document.getElementById('loading').classList.add('hidden');
  }, undefined, err => {
    console.error(err);
    document.getElementById('loading').classList.add('hidden');
  });
}

function updateLightPosition() {
  const a = state.angle * Math.PI/180, h = state.height/100;
  dirLight.position.set(Math.cos(a)*5, h*5, Math.sin(a)*5);
}

// MIS-REG
let misregCanvas = null;
function drawMisreg() {
  if (!state.misreg) { if (misregCanvas) misregCanvas.style.display='none'; return; }
  if (!misregCanvas) {
    misregCanvas = document.createElement('canvas');
    misregCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;opacity:0.28;mix-blend-mode:screen;';
    wrap.appendChild(misregCanvas);
  }
  misregCanvas.style.display = 'block';
  misregCanvas.width  = wrap.clientWidth;
  misregCanvas.height = wrap.clientHeight;
  const ctx = misregCanvas.getContext('2d');
  ctx.clearRect(0, 0, misregCanvas.width, misregCanvas.height);
  ctx.globalAlpha = 0.28;
  ctx.drawImage(renderer.domElement, 3, 3);
}

// FORMAT FRAME
function updateFormatFrame() {
  const frame = document.getElementById('format-frame');
  const fmt = formats[state.formatIdx];
  if (!fmt.w) { frame.style.display='none'; return; }
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  const aspect=fmt.w/fmt.h, wa=ww/wh;
  let fw, fh;
  if (aspect>wa) { fw=ww*0.85; fh=fw/aspect; }
  else           { fh=wh*0.85; fw=fh*aspect; }
  frame.style.cssText = `display:block;width:${fw}px;height:${fh}px;left:${(ww-fw)/2}px;top:${(wh-fh)/2}px;position:absolute;border:1px solid rgba(255,255,255,0.12);pointer-events:none;z-index:6;`;
}

// ANIMATE
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  if (state.misreg) drawMisreg();
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  camera.aspect = wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
  updateFormatFrame();
});

// PRESET UI
const presetPanel   = document.getElementById('preset-panel');
const presetTrigger = document.getElementById('preset-trigger');
const triggerChips  = document.getElementById('trigger-chips');
const triggerName   = document.getElementById('trigger-name');

function chipHTML(p) {
  return `<span class="trigger-chip" style="background:${p.a}"></span><span class="trigger-chip" style="background:${p.b}"></span><span class="trigger-chip" style="background:${p.c}"></span>`;
}

presets.forEach((p,i) => {
  const opt = document.createElement('div');
  opt.className = 'preset-opt' + (i===0?' active':'');
  opt.innerHTML = `<span class="preset-opt-name">${p.id}${p.name}</span>
    <div class="preset-opt-chips">
      <span class="preset-opt-chip" style="background:${p.a}"></span>
      <span class="preset-opt-chip" style="background:${p.b}"></span>
      <span class="preset-opt-chip" style="background:${p.c}"></span>
    </div>`;
  opt.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.preset-opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    applyPreset(p);
  });
  presetPanel.appendChild(opt);
});

triggerChips.innerHTML = chipHTML(presets[0]);
// Sync swatches to initial state colours
document.getElementById('swatch-a').style.background = state.colorA;
document.getElementById('swatch-b').style.background = state.colorB;
document.getElementById('swatch-c').style.background = state.colorC;

presetTrigger.addEventListener('click', e => {
  e.stopPropagation();
  const open = presetPanel.classList.contains('open');
  closeAll();
  if (!open) {
    const rect = presetTrigger.getBoundingClientRect();
    presetPanel.style.top  = rect.top + 'px';
    presetPanel.style.left = (rect.right + 8) + 'px';
    presetPanel.classList.add('open');
    presetTrigger.classList.add('open');
  }
});

function applyPreset(p) {
  state.colorA=p.a; state.colorB=p.b; state.colorC=p.c;
  document.getElementById('color-a').value = p.a;
  document.getElementById('color-b').value = p.b;
  document.getElementById('color-c').value = p.c;
  document.getElementById('swatch-a').style.background = p.a;
  document.getElementById('swatch-b').style.background = p.b;
  document.getElementById('swatch-c').style.background = p.c;
  triggerChips.innerHTML = chipHTML(p);
  triggerName.textContent = p.id + p.name;
  updateGradientMap();
}

// FORMAT UI
const formatPanel   = document.getElementById('format-panel');
const formatTrigger = document.getElementById('format-trigger');
const formatLabelEl = document.getElementById('format-label');

formats.forEach((f,i) => {
  const opt = document.createElement('div');
  opt.className = 'format-opt' + (i===5?' active':'');
  opt.textContent = f.label;
  opt.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.format-opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    state.formatIdx = i;
    formatLabelEl.textContent = f.label;
    updateFormatFrame();
  });
  formatPanel.appendChild(opt);
});

formatTrigger.addEventListener('click', e => {
  e.stopPropagation();
  const open = formatPanel.classList.contains('open');
  closeAll();
  if (!open) { formatPanel.classList.add('open'); formatTrigger.classList.add('open'); }
});

function closeAll() {
  presetPanel.classList.remove('open'); presetTrigger.classList.remove('open');
  formatPanel.classList.remove('open'); formatTrigger.classList.remove('open');
}
document.addEventListener('click', closeAll);

// COLOUR PICKERS
function wireColor(id, swatchId, key) {
  const input = document.getElementById(id);
  const swatch = document.getElementById(swatchId);
  function onChange() {
    state[key] = input.value;
    swatch.style.background = input.value;
    document.querySelectorAll('.preset-opt').forEach(o=>o.classList.remove('active'));
    updateGradientMap();
  }
  input.addEventListener('input', onChange);
  input.addEventListener('change', onChange);
  swatch.addEventListener('click', () => input.click());
}
wireColor('color-a','swatch-a','colorA');
wireColor('color-b','swatch-b','colorB');
wireColor('color-c','swatch-c','colorC');

// SLIDERS
document.getElementById('sl-angle').addEventListener('input', function() {
  state.angle = +this.value; updateLightPosition();
});
document.getElementById('sl-height').addEventListener('input', function() {
  state.height = +this.value; updateLightPosition();
});
document.getElementById('sl-scale').addEventListener('input', function() {
  state.scale = +this.value;
  if (currentMesh) currentMesh.scale.setScalar((1.8*(state.scale/100))/modelMaxDim);
});
document.getElementById('sl-contrast').addEventListener('input', function() {
  state.contrast = +this.value; updateGradientMap();
});
document.getElementById('sl-grain').addEventListener('input', function() {
  state.grainAmt = +this.value;
  document.getElementById('grain').style.opacity = state.grainAmt/100;
});

// ROCKS
document.querySelectorAll('.rock-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.rock-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentModelIdx = +btn.dataset.idx;
    loadModel(currentModelIdx);
  });
});

// TOGGLES
document.getElementById('toggle-misreg').addEventListener('click', function() {
  state.misreg = !state.misreg;
  this.classList.toggle('on', state.misreg);
  if (!state.misreg && misregCanvas) misregCanvas.style.display='none';
});

document.getElementById('toggle-bg').addEventListener('click', function() {
  state.showBg = !state.showBg;
  this.classList.toggle('on', state.showBg);
  updateSceneBg();
});

// EXPORT
document.getElementById('export-btn').addEventListener('click', () => {
  const fmt = formats[state.formatIdx];
  const ew = fmt.w || wrap.clientWidth;
  const eh = fmt.h || wrap.clientHeight;

  renderer.setSize(ew, eh);
  camera.aspect = ew/eh;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  const slug = fmt.label.split('/')[0].trim().toLowerCase().replace(/\s+/g,'-');
  const link = document.createElement('a');
  link.download = `krosna-${slug}-${Date.now()}.png`;
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();

  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  camera.aspect = wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
});

// INIT
updateGradientMap();
updateFormatFrame();
loadModel(0);
</script>
</body>
</html>
